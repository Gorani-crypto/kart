<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12150e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="최후방어선">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>최후방어선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Myeongjo:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 작전 지도(캔버스) + 우측 작전 콘솔. 좁은 화면에서는 지도 아래로 콘솔이 쌓인다. 단일 다크 전술 테마. */
:root{
  --bg:#12150e; --panel:#1b1f15; --panel2:#232819; --line:#363d29;
  --fg:#e7e3cf; --muted:#9b9a82; --accent:#e3a82b; --danger:#d9573c; --ok:#93c25c;
  --f-disp:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1;margin:0;letter-spacing:.02em;color:var(--accent)}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;margin-top:3px}
.flag{width:42px;height:28px;flex:none;border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.stat.gold b{color:var(--accent)}
.stat.life b{color:var(--ok)}
.stat.life.low b{color:var(--danger)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.field{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#3a2f1c}
canvas{display:block;width:100%;touch-action:manipulation}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-disp);font-size:clamp(20px,3.6vw,40px);color:#fff4d6;text-shadow:0 2px 0 #000,0 0 18px rgba(227,168,43,.6);pointer-events:none;opacity:0;transition:opacity .35s;text-align:center;white-space:nowrap}
#banner.on{opacity:1}
#pauseVeil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,12,6,.45);font-family:var(--f-disp);font-size:clamp(26px,5vw,52px);letter-spacing:.1em;color:#fff4d6;pointer-events:none}
#pop{position:absolute;z-index:5;width:250px;max-width:calc(100% - 12px);background:rgba(24,28,18,.96);border:1px solid var(--accent);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:7px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#pop .ph{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
#pop .ph b{font-family:var(--f-disp);font-weight:400;font-size:17px;line-height:1.1;min-width:0}
#pop .ph span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
#pop .row .btn{padding:6px 8px;font-size:13px}
#pop .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#pop .bopt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px;position:relative}
#pop .bopt img{width:36px;height:36px}
#pop .bopt span{font-size:12px;white-space:nowrap}
#pop .bopt small{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
#pop .bopt .lock{top:8px;width:16px;height:18px}
#pop .bopt:disabled img{filter:grayscale(1) brightness(.5)}
#pop .x{background:none;border:0;color:var(--muted);padding:0 2px;font-size:16px;line-height:1}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:18px;letter-spacing:.03em}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.12em}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{background:transparent;border:0;padding:7px 11px;font-family:var(--f-mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a1405;font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:8px 12px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1405}
.btn.warn{color:var(--danger)}
.btn[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
#pause[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stagebar{display:flex;align-items:center;gap:8px}
.stagebar .btn{padding:6px 10px;font-family:var(--f-mono)}
.stagebar b{font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;flex:1;text-align:center}
.progress{height:6px;background:#2b3121;border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.comp{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 7px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:600;margin-left:4px;color:var(--muted)}
.chip.boss{border-color:var(--danger);color:#ffb39f}
.bar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:5px;overflow-x:auto;padding:7px;background:#1d2115;border-top:1px solid var(--line);scrollbar-width:thin}
.slot{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.slot img{width:40px;height:40px;pointer-events:none;-webkit-user-drag:none}
.slot .nm{font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot .pr{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.slot:hover:not(.locked){border-color:#6b704f}
.slot[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slot.poor .pr{color:var(--danger)}
.slot.locked{cursor:not-allowed}
.slot.locked img{filter:grayscale(1) brightness(.45)}
.slot.locked .nm{color:var(--muted)}
.slot.locked .pr{color:var(--muted);font-family:var(--f-body);font-size:10.5px}
.lock{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:20px;height:22px}
#ghost{position:fixed;z-index:30;width:52px;height:52px;pointer-events:none;transform:translate(-50%,-50%);opacity:.85;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.selhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.selhead .nm{font-family:var(--f-disp);font-size:22px;line-height:1.1}
.rank{font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;background:#2d3320;border:1px solid var(--line);white-space:nowrap}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.pips i{height:7px;border-radius:1px;background:#30362a}
.pips i.on{background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:13px;align-items:baseline;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.kv dd.nx{color:var(--ok);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row .btn{flex:1 1 auto}
.hint{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
.next{font-size:12.5px;color:var(--muted)}
.next b{color:var(--fg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}

/* ═════════ 타이틀 화면 ═════════ */
#title{position:fixed;inset:0;z-index:60;background:#070605;overflow:hidden}
#title canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#title .tc{position:absolute;inset:0 0 22% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;pointer-events:none}
#title .tc>*{pointer-events:auto}
#title .tk{font:600 13px var(--f-mono);letter-spacing:.42em;color:#c9a46a;opacity:.85;text-transform:uppercase;padding-left:.42em}
#title h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(64px,13vw,150px);line-height:.95;letter-spacing:.06em;color:#f2e6c4;
  text-shadow:0 0 28px rgba(255,120,40,.45),0 4px 0 #3a1608,0 10px 30px rgba(0,0,0,.9)}
#title .tq{margin:0;font:400 clamp(14px,2.2vw,18px)/1.6 var(--f-body);color:#d8c8a4;opacity:.9;max-width:34em}
#title .tq b{color:#ff9a5a;font-weight:600}
#title .tbtns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
#tPlay{font:400 28px var(--f-disp);letter-spacing:.2em;padding:14px 54px 14px 62px;color:#1a0f05;background:linear-gradient(#f3c45a,#c98a1e);border:2px solid #ffe2a0;border-radius:4px;cursor:pointer;
  box-shadow:0 0 0 4px rgba(0,0,0,.55),0 0 36px rgba(255,160,60,.45);animation:tpulse 2.4s ease-in-out infinite}
#tPlay:hover{filter:brightness(1.12)}
@media (orientation:landscape) and (max-height:560px){#title .tc{inset:0;gap:6px;padding:8px}#title .tk{font-size:10px}#title h1{font-size:min(64px,16vh)}#title .tq{font-size:12px;line-height:1.4}#title .tbtns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;max-width:92vw}#title .tbtns .tsave{flex-basis:100%}#tPlay{font-size:20px;padding:8px 28px}#title .tnew{font-size:15px;padding:6px 16px;letter-spacing:.06em}#title .tfoot{display:none}}
html.rot #title .tc{inset:0;gap:6px;padding:8px}html.rot #title .tk{font-size:10px}html.rot #title h1{font-size:min(64px,16vw)}html.rot #title .tq{font-size:12px;line-height:1.4}html.rot #title .tbtns{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px;max-width:92vh}html.rot #title .tbtns .tsave{flex-basis:100%}html.rot #tPlay{font-size:20px;padding:8px 28px}html.rot #title .tnew{font-size:15px;padding:6px 16px;letter-spacing:.06em}html.rot #title .tfoot{display:none}
#title .tbtns{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px!important;width:min(640px,92vw);max-width:none!important}html.rot #title .tbtns{width:min(640px,92vh)}#title .tbtns>button{width:100%;margin:0;padding-left:6px!important;padding-right:6px!important;letter-spacing:.06em;white-space:nowrap}#title .tbtns .tsave{grid-column:1/-1}#title .tbtns>#tBgm{font:400 18px var(--f-disp);color:#f2e6c4;padding-top:9px;padding-bottom:9px;border-color:#a0784a;background:rgba(0,0,0,.5)}html.rot #title .tbtns>#tBgm{font-size:15px;padding-top:6px;padding-bottom:6px}@media (orientation:landscape) and (max-height:560px){#title .tbtns>#tBgm{font-size:15px;padding-top:6px;padding-bottom:6px}}#title .tbtns>#tBgm{font:400 18px var(--f-disp);color:#f2e6c4;padding-top:9px;padding-bottom:9px;border-color:#a0784a;background:rgba(0,0,0,.5)}html.rot #title .tbtns>#tBgm,body #title .tbtns>#tBgm.sm{font-size:15px}@media (orientation:landscape) and (max-height:560px){#title .tbtns>#tBgm{font-size:15px;padding-top:6px;padding-bottom:6px}}#tPlay{font-size:22px}
@keyframes tpulse{50%{box-shadow:0 0 0 4px rgba(0,0,0,.55),0 0 60px rgba(255,140,40,.75)}}
#title .tnew{font:400 20px var(--f-disp);letter-spacing:.14em;padding:9px 34px 9px 40px;color:#f2e6c4;background:rgba(0,0,0,.5);border:1px solid #a0784a;border-radius:4px;cursor:pointer}
#title .tnew:hover{background:rgba(60,30,10,.7)}
#title .tnew.warn{border-color:#d9573c;color:#ffb08a}
#tBgm{font:600 13px var(--f-body);color:#d8c8a4;background:rgba(0,0,0,.45);border:1px solid #5a4a30;border-radius:4px;padding:7px 14px;cursor:pointer}
#title .tsave{font:500 12px var(--f-mono);color:#9b8a6a;margin-top:4px}
#title .tfoot{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:500 11px var(--f-mono);color:#6d5f48;letter-spacing:.2em;pointer-events:none}
@media (prefers-reduced-motion:reduce){#tPlay{animation:none}}
#pop .tgrow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}#pop .tgrow .btn{padding:5px 0;font-size:12px}#pop .tgrow .btn[aria-pressed="true"]{background:var(--accent);color:#1a1205;border-color:var(--accent)}
#cut{position:fixed;inset:0;z-index:40;background:rgba(6,7,4,.92);display:grid;place-items:center;padding:16px}
#cut .cutbox{width:min(960px,100%,calc((100dvh - 84px)*1.6));display:flex;flex-direction:column;gap:8px}html.rot #cut .cutbox{width:min(960px,100%,calc((var(--sw) - 84px)*1.6))}@media (max-height:560px){#cut{padding:6px 12px}}
#cutCv{width:100%;height:auto;aspect-ratio:16/10;max-width:100%;border-radius:4px;cursor:pointer;background:#f3ead2}
#cut .cutbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#cut .dots{display:flex;gap:6px}
#cut .dots i{width:28px;height:5px;border-radius:2px;background:#3a3f2c}
#cut .dots i.on{background:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(5,7,3,.72);display:grid;place-items:center;padding:20px;z-index:20}
#modal .box{max-width:400px;width:100%;border-color:var(--accent)}
#modal p{margin:0;line-height:1.6}
#modal .unl{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:2px solid var(--accent);border-radius:6px;background:var(--panel2)}
#modal .unl b{font-family:var(--f-disp);font-weight:400;font-size:20px;color:var(--accent)}
#modal .unl span{font-size:13px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
.skipb{width:100%;margin:6px 0 2px}


/* ── 폰 가로 모드(높이 560px 이하 가로 화면): 지도를 크게, 왼쪽 무기 목록 · 오른쪽 ☰/배속, 나머지는 ☰ 서랍 ── */
/* 폰을 세로로 들어도 화면을 90도 돌려 가로 화면으로 보여줌 */
html.rot,html.rot body{overflow:hidden}
html.rot body{position:fixed;top:0;left:var(--sw);width:var(--sh);height:var(--sw);transform-origin:0 0;transform:rotate(90deg);margin:0}

#tVer{position:absolute;right:10px;bottom:6px;font:500 10px var(--f-mono);color:#6d5f48;letter-spacing:.05em;pointer-events:none}.verTag{font:500 10px var(--f-mono);color:var(--muted);opacity:.7;margin-left:8px}
#rcol,#drawerBg{display:none}
body.cmp{padding:2px max(4px,env(safe-area-inset-right,0px)) 0 max(4px,env(safe-area-inset-left,0px));overflow:hidden;height:100dvh}html.rot body.cmp{height:var(--sw)}html.rot #slotPanel .mv,html.rot #movePanel .mv{max-height:calc(var(--sw) - 24px)}html.rot body.cmp .side{width:min(360px,86vh)}
body.cmp .app{max-width:none;gap:2px}
body.cmp .top{padding:0 6px;border:0;gap:0 16px;flex-wrap:nowrap;align-items:center;height:22px;justify-content:center}
body.cmp .brand{display:none}
body.cmp .stats{gap:0 18px;flex-wrap:nowrap}
body.cmp .stat{flex-direction:row;gap:5px;align-items:baseline}
body.cmp .stat b{font-size:13px}
body.cmp .stat span{font-size:10px;letter-spacing:0}
body.cmp .main{display:block}
body.cmp .field{display:grid;grid-template-columns:auto auto auto;justify-content:center;align-items:start;border:0;border-radius:0;background:transparent;overflow:visible}
body.cmp #cv{grid-column:2;grid-row:1;border:1px solid var(--line);border-radius:4px}
body.cmp .bar{grid-column:1;grid-row:1;grid-auto-flow:row;grid-auto-columns:auto;grid-auto-rows:min-content;width:64px;overflow-y:auto;overflow-x:hidden;padding:3px;gap:3px;border:0;border-radius:4px;margin-right:4px}
body.cmp .slot{padding:3px 2px;touch-action:pan-y}
body.cmp .slot img{width:30px;height:30px}
body.cmp .slot .nm{font-size:10px}
body.cmp .slot .pr{font-size:9.5px}
body.cmp .lock{top:6px;width:16px;height:18px}
body.cmp #rcol{display:flex;grid-column:3;grid-row:1;flex-direction:column;gap:5px;margin-left:4px;width:52px}
body.cmp #rcol .btn,body.cmp #menuBtn{width:52px;padding:7px 0;font-size:12px;text-align:center}
body.cmp #menuBtn{font-size:20px;line-height:1;padding:8px 0;border:1px solid var(--accent);border-radius:6px;background:var(--panel2);color:var(--accent)}
body.cmp #rcol .seg{display:flex;flex-direction:column;width:52px}
body.cmp #rcol .seg button{padding:8px 0;font-size:12.5px}
body.cmp .side{position:fixed;top:0;right:0;bottom:0;width:min(360px,86vw);overflow-y:auto;background:var(--bg);z-index:45;padding:10px max(10px,env(safe-area-inset-right,0px)) 16px 10px;transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.6)}
body.cmp.drawer .side{transform:none}
body.cmp.drawer #drawerBg{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.5)}

#movePanel{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px}#movePanel[hidden]{display:none}#movePanel .mv{background:#1b1f15;border:1px solid #4a4230;border-radius:10px;max-width:520px;width:100%;padding:18px;color:#e7e3cf;font:14px var(--f-body)}#movePanel h3{margin:0 0 6px;font:22px var(--f-disp);color:#e3a82b}#movePanel p{margin:4px 0 10px;color:#b9b49a;font-size:13px;line-height:1.5}#movePanel textarea{width:100%;height:110px;box-sizing:border-box;background:#0e100b;color:#e7e3cf;border:1px solid #3a3a2a;border-radius:6px;font:11px var(--f-mono);padding:8px;word-break:break-all}#movePanel .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#movePanel button{flex:1;min-width:120px;padding:10px;border-radius:6px;border:1px solid #6a5a30;background:#2a2618;color:#f1e3b0;font:15px var(--f-disp);cursor:pointer}#movePanel .msg{min-height:18px;color:#93c25c;font-size:13px;margin-top:8px}

<script>
"use strict";
/* ═════════ 맵 (19×13, 6개 차선 지그재그) ═════════ */
const COLS=19, ROWS=13;
// 사용자 지정 경로: 왼쪽 구역 지그재그 → 가운데 세로길로 상승 → 오른쪽 구역 지그재그 → 오른쪽 아래 출구
const WP=[[-1,1],[7,1],[7,3],[1,3],[1,5],[7,5],[7,7],[1,7],[1,9],[9,9],[9,1],[16,1],[16,3],[11,3],[11,5],[16,5],[16,7],[11,7],[11,10],[19.3,10]].map(([x,y])=>[x+.5,y+.5]);
const SEG=[]; let PLEN=0;
for(let i=0;i<WP.length-1;i++){const a=WP[i],b=WP[i+1],len=Math.hypot(b[0]-a[0],b[1]-a[1]);SEG.push({a,b,len,s:PLEN,dx:(b[0]-a[0])/len,dy:(b[1]-a[1])/len});PLEN+=len;}
const PATH=new Set();
for(const s of SEG){const x0=Math.floor(s.a[0]),y0=Math.floor(s.a[1]),x1=Math.floor(s.b[0]),y1=Math.floor(s.b[1]);
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)if(x>=0&&x<COLS)PATH.add(x+","+y);}
const BLOCK=new Set(["0,0"]); // 적국 국기
function posAt(d){for(const s of SEG){if(d<=s.s+s.len){const k=d-s.s;return[s.a[0]+s.dx*k,s.a[1]+s.dy*k,s.dx,s.dy];}}const L=SEG[SEG.length-1];return[L.b[0],L.b[1],1,0];}

/* ═════════ 국가(스테이지) ═════════ */

const COUNTRIES=[

  {name:"중동 연합국",desc:"사막의 왕국과 공화국들이 손잡은 가상의 연합국. 오일 머니로 사들인 장비와 사막전 경험으로 버틴다.",flag:"meu",titles:{"국방부장관":"중동 연합군 총사령관"},bg:"desert",pos:[46,28],shemagh:true,veh:"tech",

  {name:"미국",desc:"세계 최강의 군사 대국. 끝없는 물량과 최첨단 장비로 마지막 방어선을 시험한다.",flag:"us",titles:{},bg:"usa",pos:[-77,39],veh:"plane",

   uniform:"#5a3a7a",camo:"#3a2a5a",helmet:"#7a5aa0",beret:"#2a1a4a"}];

// 보스: 계급, 직책, 추가 배율
// 보스: 계급, 직책, 종류(2=최종 1=주력 0=중간), 체력, 속도 배율(일반병 대비) — 뒤로 갈수록 느리고 튼튼하다
// 주력 보스(중대장·대대장·사단장·국방부장관)는 더 큰 이벤트: 보상 2배, 큰 연출
const BOSS={10:[8,"소대장",0,1500,.7],20:[10,"중대장",1,1e4,.65],30:[7,"대대 주임원사",0,2.5e4,.6],40:[11,"대대 작전과장",0,3e4,.55],50:[12,"대대장",1,1e5,.5],
  60:[13,"연대장",0,1.8e5,.47],70:[14,"여단장",0,3e5,.43],80:[15,"사단장",1,5e5,.4],90:[16,"군단장",0,7e5,.35],100:[18,"국방부장관",2,2e6,.3]};

  {cont:"아시아",hp:1e17,names:["중국","일본","인도","인도네시아","베트남","태국","필리핀","말레이시아","싱가포르","파키스탄","방글라데시","스리랑카","네팔","몽골","카자흐스탄","우즈베키스탄","미얀마","캄보디아","라오스","브루나이"]},

function drawEnemy(e,T){if(e.alien)return drawAlien(e,T);if(e.veh)return drawVeh(e,T);const al=e.boss?1:alive(e),crowd=enemies.length;

    for(let i=Math.min(al-1,2)-1;i>=0;i--){const[f,l]=F[i];e.x=ox+c*f-sn*l;e.y=oy+sn*f+c*l;e.step=dr?st0:st0+i*1.7;drawSoldier(e,T,true);}
    e.x=ox;e.y=oy;e.step=st0;}
  drawSoldier(e,T,false,crowd>100&&!e.boss&&e.id%3);
  if(al>2&&(crowd<=25||e.id%9===0)){const r=e.size;X.font=`700 .22px "IBM Plex Mono",monospace`;X.textAlign="center";X.lineWidth=.05;X.strokeStyle="rgba(0,0,0,.85)";X.strokeText("×"+fmt(al*DISP()),e.x,e.y+r+.36);X.fillStyle="#fff2c8";X.fillText("×"+fmt(al*DISP()),e.x,e.y+r+.36);X.textAlign="left";}}
function drawSoldier(e,T,lite,noIns){const CC=e.uni||COUNTRY;

  if(!e.boss&&!e.mc&&enemies.length>250){const r=e.size*(lite?.85:1),x=e.x,y=e.y;X.fillStyle=e.hitT>0?"#fff":CC.uniform;X.beginPath();X.arc(x,y,r*.5,0,7);X.fill();X.fillStyle=e.r>=8?CC.beret:CC.helmet;X.beginPath();X.arc(x,y,r*.3,0,7);X.fill();
    if(lite)return;if(!noIns&&e.id%2===0)insignia(e.r,x,y-r-.1-.38,.2);if(e.hp<e.max){const yy=y+r*.75;X.fillStyle="rgba(0,0,0,.6)";X.fillRect(x-.23,yy,.46,.05);X.fillStyle="#93c25c";X.fillRect(x-.23,yy,.46*Math.max(0,e.hp/e.max),.05);}return;}
  const x=e.x,y=e.y,a=Math.atan2(e.dy,e.dx),r=e.size*(lite?.85:1),bob=CC.drill?Math.abs(Math.sin(T*5.6))*.03:Math.sin(e.step)*.025,minister=e.r===18;

    if(e.kind){X.strokeStyle="rgba(240,190,70,.45)";X.lineWidth=.03;X.beginPath();X.arc(x,y,r*1.2-pul,0,7);X.stroke();}}
  X.save();X.translate(x,y+bob);X.rotate(a);
  if(CC.drill&&!minister&&!e.boss){// 거위걸음: 다리를 곧게 차올리고, 총은 전원 같은 각도로 어깨에
    const ph=Math.sin(T*5.6),k1=Math.max(0,ph)*r*.6,k2=Math.max(0,-ph)*r*.6;X.fillStyle="#2c2a1a";
    X.fillRect(-r*.1,-r*.3,r*.3+k1,r*.17);X.fillRect(-r*.1,r*.13,r*.3+k2,r*.17);
    X.fillStyle="#1d1a14";X.save();X.translate(-r*.05,r*.34);X.rotate(-.5);X.fillRect(-r*.55,-r*.05,r*1.05,r*.1);X.restore();}
  else{
  if(!minister){X.fillStyle="#1d1a14";X.fillRect(r*.1,r*.24,r*.95,r*.12);}
  const sw=Math.sin(e.step)*r*.18;X.fillStyle=minister?"#111":"#3a3420";X.beginPath();X.arc(-r*.05+sw,-r*.36,r*.13,0,7);X.arc(-r*.05-sw,r*.36,r*.13,0,7);X.fill();}
  X.fillStyle=e.hitT>0?"#fff":minister?"#1c1c22":CC.uniform;X.beginPath();X.ellipse(0,0,r*.42,r*.6,0,0,7);X.fill();
  if(!minister&&e.hitT<=0){X.fillStyle=CC.camo;X.beginPath();X.arc(-r*.15,-r*.25,r*.14,0,7);X.arc(r*.12,r*.2,r*.12,0,7);X.fill();
    if(CC.fleck){for(const[a,b,c]of[[-.2,.1,"#2a2a1e"],[.15,-.25,"#7a5a32"],[0,.38,"#2a2a1e"],[-.05,-.45,"#7a5a32"],[.25,.05,"#2a2a1e"]]){X.fillStyle=c;X.beginPath();X.arc(r*a,r*b,r*.06,0,7);X.fill();}}}
  if(minister){X.strokeStyle="#c0392b";X.lineWidth=r*.12;X.beginPath();X.moveTo(-r*.3,-r*.45);X.lineTo(r*.3,r*.45);X.stroke();}
  const officer=e.r>=8;X.fillStyle=minister?"#2b1d14":officer?CC.beret:CC.helmet;X.beginPath();X.arc(0,0,r*.32,0,7);X.fill();
  if(CC.shemagh&&!officer&&!minister){X.fillStyle="#efe9dc";X.beginPath();X.arc(0,0,r*.33,0,7);X.fill();X.beginPath();X.moveTo(-r*.2,-r*.2);X.lineTo(-r*.62,-r*.05);X.lineTo(-r*.6,r*.12);X.lineTo(-r*.2,r*.2);X.fill();
    X.fillStyle="#b3262e";for(const[a,b]of[[-.12,-.12],[.1,-.12],[-.12,.1],[.1,.1],[0,0],[-.4,0]]){X.fillRect(r*a-r*.04,r*b-r*.04,r*.08,r*.08);}X.strokeStyle="#1d1d1d";X.lineWidth=r*.06;X.beginPath();X.arc(0,0,r*.22,0,7);X.stroke();}
  if(officer&&!minister&&CC.drill){X.fillStyle="#5e5c38";X.beginPath();X.ellipse(r*.06,0,r*.46,r*.42,0,0,7);X.fill();X.strokeStyle="#b8322a";X.lineWidth=r*.07;X.beginPath();X.arc(0,0,r*.3,0,7);X.stroke();X.fillStyle="#d9b84a";X.beginPath();X.arc(r*.28,0,r*.06,0,7);X.fill();}
  else if(officer&&!minister){X.fillStyle="#e3b23c";X.beginPath();X.arc(r*.18,0,r*.07,0,7);X.fill();}
  if(e.mc){X.fillStyle=`rgba(220,90,255,${.7+.3*Math.sin(T*8+e.id)})`;X.shadowColor="#d65aff";X.shadowBlur=8*DPR;X.beginPath();X.arc(r*.22,-r*.1,r*.07,0,7);X.arc(r*.22,r*.1,r*.07,0,7);X.fill();X.shadowBlur=0;}
  X.restore();if(e.mc&&!lite){X.strokeStyle=`rgba(200,90,255,${.35+.25*Math.sin(T*5+e.id)})`;X.lineWidth=.04;X.beginPath();X.arc(x,y,r*.9,0,7);X.stroke();}if(lite)return;
  const u=e.boss?.28:.2;if(!noIns)insignia(e.r,x,y-r-.1-u*1.9,u);

const LOCK_SVG=`<svg class="lock" viewBox="0 0 20 22" aria-hidden="true"><path d="M5 9V6a5 5 0 0 1 10 0v3" fill="none" stroke="#e7e3cf" stroke-width="2.4"/><rect x="2" y="9" width="16" height="12" rx="2" fill="#e3a82b"/><circle cx="10" cy="15" r="2" fill="#1a1405"/></svg>`;

function cellAt(ev){const r=C.getBoundingClientRect(),rv=ROT(),fx=rv?(ev.clientY-r.top)/r.height:(ev.clientX-r.left)/r.width,fy=rv?(r.right-ev.clientX)/r.width:(ev.clientY-r.top)/r.height;const x=Math.floor(fx*COLS),y=Math.floor(fy*ROWS);return x>=0&&x<COLS&&y>=0&&y<ROWS?[x,y]:null;}
const towerAt=(x,y)=>S.towers.find(t=>t.x===x&&t.y===y);
const canPlace=(x,y)=>!PATH.has(x+","+y)&&!BLOCK.has(x+","+y)&&!towerAt(x,y);
function place(type,x,y){if(lockText(type))return null;const cost=placeCost(type);if(S.gold<cost||!canPlace(x,y))return null;S.gold-=cost;
  const nt={id:nextId++,type,x,y,l:1,inv:cost,cd:type==="nuke"?1/TT.nuke.rate:0,ang:-Math.PI/2,kills:0};S.towers.push(nt);dirtyUI=true;return nt;}
C.addEventListener("pointermove",ev=>{hover=cellAt(ev);});
C.addEventListener("pointerleave",()=>{hover=null;});
C.addEventListener("click",ev=>{const c=cellAt(ev);if(!c)return;const t=towerAt(c[0],c[1]);
  if(t){sel=t;buildType=null;buildCell=null;dirtyUI=true;return;}
  if(buildType&&canPlace(c[0],c[1])){const nt=place(buildType,c[0],c[1]);if(!nt){banner("자금이 부족합니다");return;}
    fx.push({k:"ring",x:c[0]+.5,y:c[1]+.5,life:.5,m:.5,col:"#e3a82b",R:.8});sel=nt;save();
    if(S.gold<placeCost(buildType))buildType=null;return;}
  sel=null;buildCell=(!buildType&&canPlace(c[0],c[1])&&!(buildCell&&buildCell[0]===c[0]&&buildCell[1]===c[1]))?c:null;dirtyUI=true;});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){sel=null;buildType=null;buildCell=null;dirtyUI=true;}
  if(e.code==="Space"&&!/INPUT|TEXTAREA|BUTTON/.test(document.activeElement?.tagName||"")){e.preventDefault();togglePause();}});

function evoBurst(x,y,tr){const col=TCOL[tr],big=tr-2;shakeT=Math.max(shakeT,.7+big*.2);
  fx.push({k:"pillar",x,y,life:2.2,m:2.2,col,w:.5+big*.18},{k:"rays",x,y,life:1.8,m:1.8,col,n:10+big*4,R:2.2+big*.6},{k:"tflash",life:.5,m:.5,col});
